<div class="sidebar-content d-flex flex-column">

  <h2 class="fs-3 text-center mb-5">
    E-commerce
  </h2>

  <ul class="navbar-nav gap-2">

    <li class="nav-item">
      <a
        class="nav-link d-flex align-items-center gap-3 p-3"
        routerLink="dashboard"
        routerLinkActive="active fw-bold"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-gear-fill"></i>
        <span>Admin Dashboard</span>
      </a>
    </li>

    <li class="nav-item">
      <a
        class="nav-link d-flex align-items-center gap-3 p-3"
        routerLink="products"
        routerLinkActive="active fw-bold"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-bag-fill"></i>
        <span>Manage Products</span>
      </a>
    </li>

    <li class="nav-item">
      <a
        class="nav-link d-flex align-items-center gap-3 p-3"
        routerLink="users"
        routerLinkActive="active fw-bold"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-people-fill"></i>
        <span>Manage Users</span>
      </a>
    </li>

  </ul>

  <div class="mt-auto">
    <a class="nav-link d-flex align-items-center gap-3 p-3">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>

</div>
