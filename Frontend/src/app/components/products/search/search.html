<div class="mb-3">
  <label for="search" class="form-label">Search</label>
  <input
    type="text"
    class="form-control"
    name="search"
    id="search"
    placeholder="Search..."
    [ngModel]="productService.search()"
    (ngModelChange)="productService.search.set($event);productService.page.set(1)"
  />
</div>
