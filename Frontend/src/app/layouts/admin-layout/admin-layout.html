<div class="admin-layout min-vh-100">

  <aside class="sidebar" [style.transform]="
      open() || !isMobile()
        ? 'translateX(0)'
        : 'translateX(-100%)'
    ">
    <app-sidebar></app-sidebar>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <button class="btn btn-primary rounded-circle position-fixed z-4 d-block d-lg-none"
  style="bottom: 24px; right: 24px;"
  (click)="open.update(f => !f)"
  ><i class="bi bi-gear-fill fs-3"></i></button>

</div>
