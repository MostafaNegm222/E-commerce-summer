<div class="d-flex flex-column justify-content-between h-100">
  <div class="p-4 d-flex flex-column justify-content-between">
  <h1 class="text-center text-primary my-5">Forget Password Page</h1>
  <form (submit)="onSubmit($event)" class="w-100">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      placeholder="Enter your email..."
      [formField]="forgetForm.email"
      [class.is-invalid]="showError(forgetForm.email())"
    />
    @if(showError(forgetForm.email())) {
      <small class="text-danger">{{forgetForm.email().errors()[0]?.message}}</small>
    }
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="forgetForm().invalid() || forgetForm().submitting()">Send Link</button>
</form>
</div>
</div>
