<div class="d-flex flex-column justify-content-between h-100">
  <div class="p-4 d-flex flex-column justify-content-between">
  <h1 class="text-center text-primary my-5">Login Page</h1>
  <form (submit)="onSubmit($event)" class="w-100">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="email"
      placeholder="Enter your email..."
      [formField]="loginForm.email"
      [class.is-invalid]="showError(loginForm.email())"
    />
    @if(showError(loginForm.email())) {
      <small class="text-danger">{{loginForm.email().errors()[0]?.message}}</small>
    }
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="Enter your password..."
      [formField]="loginForm.password"
      [class.is-invalid]="showError(loginForm.password())"
    />
    @if(showError(loginForm.password())) {
      <small class="text-danger">{{loginForm.password().errors()[0]?.message}}</small>
    }
  </div>
  <div class="d-flex justify-content-end mb-3">
    <a routerLink="/auth/forget-password">Forget Password ?</a>
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="loginForm().invalid() || loginForm().submitting()">Login</button>
</form>
</div>
<p class="text-center">You don't have account ? <a class="text-decoration-none" routerLink="/auth/signup">Signup</a></p>
</div>
