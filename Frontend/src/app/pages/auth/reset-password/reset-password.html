<div class="d-flex flex-column justify-content-between h-100">
  <div class="p-4 d-flex flex-column justify-content-between">
  <h1 class="text-center text-primary my-5">Rest Password Page</h1>
  <form (submit)="onSubmit($event)" class="w-100">

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      placeholder="Enter your password..."
      [formField]="resetForm.password"
      [class.is-invalid]="showError(resetForm.password())"
    />
    @if(showError(resetForm.password())) {
      <small class="text-danger">{{resetForm.password().errors()[0]?.message}}</small>
    }
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="resetForm().invalid() || resetForm().submitting()">Reset password</button>
</form>
</div>
</div>
